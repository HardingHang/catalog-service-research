<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-label="commit 抽象流程">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
      .h{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:20px;font-weight:700;fill:#0f172a}
      .s{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:16px;fill:#475569}
      .mono{font-family:Consolas,"Microsoft YaHei",monospace;font-size:15px;fill:#1e293b}
      .step{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .ok{fill:#ecfdf5;stroke:#34d399;stroke-width:2}
      .warn{fill:#fffbeb;stroke:#f59e0b;stroke-width:2}
      .bad{fill:#fef2f2;stroke:#f87171;stroke-width:2}
      .line{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="48" y="58" class="title">Commit 抽象流程：OCC + CAS</text>

  <rect x="60" y="140" width="205" height="96" rx="10" class="step"/>
  <text x="88" y="176" class="h">1. 读 HEAD</text>
  <text x="88" y="207" class="mono">Ccurrent</text>

  <rect x="315" y="140" width="215" height="96" rx="10" class="step"/>
  <text x="343" y="176" class="h">2. 构建视图</text>
  <text x="343" y="207" class="mono">state(Ccurrent)</text>

  <rect x="580" y="140" width="190" height="96" rx="10" class="step"/>
  <text x="608" y="176" class="h">3. OCC</text>
  <text x="608" y="207" class="mono">expected?</text>

  <rect x="820" y="140" width="230" height="96" rx="10" class="step"/>
  <text x="848" y="176" class="h">4. 写 objs</text>
  <text x="848" y="207" class="mono">Cnext(parent)</text>

  <rect x="1100" y="140" width="235" height="96" rx="10" class="step"/>
  <text x="1128" y="176" class="h">5. CAS</text>
  <text x="1128" y="207" class="mono">Ccurrent -> Cnext</text>

  <path d="M265 188 L315 188" class="line"/>
  <path d="M530 188 L580 188" class="line"/>
  <path d="M770 188 L820 188" class="line"/>
  <path d="M1050 188 L1100 188" class="line"/>

  <rect x="560" y="330" width="230" height="92" rx="10" class="bad"/>
  <text x="590" y="366" class="h">3.1 OCC 冲突</text>
  <text x="590" y="397" class="s">返回冲突</text>
  <path d="M675 236 L675 330" class="line"/>

  <rect x="930" y="330" width="220" height="92" rx="10" class="ok"/>
  <text x="960" y="366" class="h">5.1 CAS 成功</text>
  <text x="960" y="397" class="s">Cnext 成为 HEAD</text>
  <path d="M1190 236 C1160 285 1105 315 1040 330" class="line"/>

  <rect x="1190" y="330" width="190" height="92" rx="10" class="warn"/>
  <text x="1218" y="366" class="h">5.2 CAS 失败</text>
  <text x="1218" y="397" class="s">HEAD 已前进</text>
  <path d="M1245 236 L1285 330" class="line"/>

  <rect x="535" y="610" width="330" height="88" rx="10" class="warn"/>
  <text x="565" y="645" class="h">重新开始一轮</text>
  <text x="565" y="675" class="s">读取最新 HEAD 后重建视图并再做 OCC</text>

  <path d="M1285 422 L1285 555 L865 654" class="dash"/>
  <path d="M535 654 L162 654 L162 236" class="dash"/>
</svg>
