<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
  <title id="title">P1 Polaris Gateway Phase4 MVP architecture</title>
  <desc id="desc">Branch-aware Iceberg REST Gateway in front of Apache Polaris, backed by PostgreSQL Version Store and MinIO object storage.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .service { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.5; rx: 8; }
      .store { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 8; }
      .external { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 8; }
      .muted { fill: #64748b; font-size: 14px; font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; }
      .label { fill: #0f172a; font-size: 18px; font-weight: 700; font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; }
      .small { fill: #334155; font-size: 13px; font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; }
      .tiny { fill: #475569; font-size: 12px; font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; }
      .line { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="700" />
  <text class="label" x="50" y="48">P1 Polaris Gateway Phase4 MVP</text>
  <text class="muted" x="50" y="74">Gateway 是 branch-aware 读写入口；PostgreSQL Version Store 是 refs/commits/index 的权威状态；Polaris 保留 main 基线与 bootstrap 来源。</text>

  <rect class="panel" x="50" y="115" width="220" height="455" />
  <text class="label" x="78" y="152">Iceberg Clients</text>
  <text class="small" x="78" y="188">Spark / Trino / Flink</text>
  <text class="small" x="78" y="213">PyIceberg / Java API</text>
  <text class="small" x="78" y="250">Header:</text>
  <text class="tiny" x="96" y="274">X-Catalog-Ref: dev_a</text>
  <text class="small" x="78" y="319">MVP paths:</text>
  <text class="tiny" x="96" y="343">list namespaces</text>
  <text class="tiny" x="96" y="366">list tables</text>
  <text class="tiny" x="96" y="389">load table</text>
  <text class="tiny" x="96" y="412">single table commit</text>

  <rect class="service" x="380" y="110" width="330" height="480" />
  <text class="label" x="418" y="148">P1 REST Gateway</text>
  <text class="muted" x="418" y="173">Quarkus + Java 21</text>

  <rect class="panel" x="415" y="205" width="260" height="50" />
  <text class="small" x="440" y="235">RefResolver: header default main</text>

  <rect class="panel" x="415" y="275" width="260" height="62" />
  <text class="small" x="440" y="303">Iceberg REST adapter</text>
  <text class="tiny" x="440" y="324">namespace/table read + commitTable</text>

  <rect class="panel" x="415" y="357" width="260" height="74" />
  <text class="small" x="440" y="385">CommitService</text>
  <text class="tiny" x="440" y="406">requirements -> metadata -> DB CAS</text>

  <rect class="panel" x="415" y="451" width="260" height="74" />
  <text class="small" x="440" y="479">Bootstrap + Branch API</text>
  <text class="tiny" x="440" y="500">bootstrap main, create branch</text>

  <rect class="store" x="830" y="105" width="280" height="200" />
  <text class="label" x="858" y="143">PostgreSQL Version Store</text>
  <text class="small" x="858" y="181">catalog_refs</text>
  <text class="small" x="858" y="206">catalog_commits</text>
  <text class="small" x="858" y="231">content_values / content_index</text>
  <text class="small" x="858" y="256">commit_ops / idempotency / audit</text>

  <rect class="external" x="830" y="365" width="280" height="115" />
  <text class="label" x="858" y="403">Apache Polaris 1.4.1</text>
  <text class="small" x="858" y="439">bootstrap source</text>
  <text class="small" x="858" y="464">management + current main view</text>

  <rect class="external" x="830" y="525" width="280" height="115" />
  <text class="label" x="858" y="563">MinIO Object Storage</text>
  <text class="small" x="858" y="599">Iceberg metadata JSON</text>
  <text class="small" x="858" y="624">table data files</text>

  <path class="line" d="M270 315 C315 315, 330 315, 380 315" />
  <text class="tiny" x="286" y="296">Iceberg REST</text>

  <path class="line" d="M710 240 C750 240, 780 205, 830 205" />
  <text class="tiny" x="735" y="198">refs / commits / indexes</text>

  <path class="dash" d="M710 455 C756 455, 778 423, 830 423" />
  <text class="tiny" x="725" y="410">bootstrap list/load</text>

  <path class="line" d="M710 535 C760 535, 785 585, 830 585" />
  <text class="tiny" x="727" y="565">write metadata</text>

  <path class="dash" d="M970 480 C970 500, 970 505, 970 525" />
  <text class="tiny" x="986" y="509">Polaris writes metadata during seed</text>

  <rect class="panel" x="50" y="610" width="660" height="52" />
  <text class="small" x="76" y="641">Phase4 MVP boundary: 单表 branch commit 已闭环；diff / publish / multi-table transaction / drop / rename 保持明确 501 占位。</text>
</svg>
