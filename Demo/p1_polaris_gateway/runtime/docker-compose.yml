name: p1-polaris-gateway

services:
  postgres:
    image: postgres:16
    container_name: p1-gateway-postgres
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: p1_gateway
      POSTGRES_USER: p1_gateway
      POSTGRES_PASSWORD: p1_gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p1_gateway -d p1_gateway"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: p1-gateway-minio
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: polaris_root
      MINIO_ROOT_PASSWORD: polaris_pass
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  bucket-setup:
    image: amazon/aws-cli:2.34.9
    container_name: p1-gateway-bucket-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: polaris_root
      AWS_SECRET_ACCESS_KEY: polaris_pass
      AWS_ENDPOINT_URL: http://minio:9000
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        aws s3 mb s3://bucket123 || true &&
        aws s3 ls

  polaris:
    image: apache/polaris:1.4.1
    container_name: p1-gateway-polaris
    ports:
      - "8281:8181"
      - "8282:8182"
    extra_hosts:
      - "sts.amazonaws.com:172.19.0.3"
    depends_on:
      minio:
        condition: service_healthy
      bucket-setup:
        condition: service_completed_successfully
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: polaris_root
      AWS_SECRET_ACCESS_KEY: polaris_pass
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ENDPOINT_URL_STS: http://minio:9000
      QUARKUS_S3_PATH_STYLE_ACCESS: "true"
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      POLARIS_FEATURES_DEFAULTS_ALLOW_SENDING_CREDENTIALS: "true"
      QUARKUS_OTEL_SDK_DISABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  gateway:
    image: gradle:8-jdk21
    container_name: p1-gateway-placeholder
    working_dir: /workspace
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/p1_gateway
      QUARKUS_DATASOURCE_USERNAME: p1_gateway
      QUARKUS_DATASOURCE_PASSWORD: p1_gateway
    volumes:
      - ../gateway-service:/workspace
    command: ["sh", "-c", "tail -f /dev/null"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /workspace/build.gradle.kts"]
      interval: 5s
      timeout: 5s
      retries: 5
