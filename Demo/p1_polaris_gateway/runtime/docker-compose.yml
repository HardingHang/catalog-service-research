name: p1-polaris-gateway

services:
  postgres:
    image: postgres:16
    container_name: p1-gateway-postgres
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: p1_gateway
      POSTGRES_USER: p1_gateway
      POSTGRES_PASSWORD: p1_gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p1_gateway -d p1_gateway"]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.81
    container_name: p1-gateway-rustfs
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      RUSTFS_ACCESS_KEY: polaris_root
      RUSTFS_SECRET_KEY: polaris_pass
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/health && curl --fail http://127.0.0.1:9001/rustfs/console/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  bucket-setup:
    image: amazon/aws-cli:2.34.9
    container_name: p1-gateway-bucket-setup
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: polaris_root
      AWS_SECRET_ACCESS_KEY: polaris_pass
      AWS_ENDPOINT_URL: http://rustfs:9000
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        aws s3 mb s3://bucket123 || true &&
        aws s3 ls

  polaris:
    image: apache/polaris:1.4.1
    container_name: p1-gateway-polaris
    ports:
      - "8281:8181"
      - "8282:8182"
    depends_on:
      rustfs:
        condition: service_healthy
      bucket-setup:
        condition: service_completed_successfully
    environment:
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: polaris_root
      AWS_SECRET_ACCESS_KEY: polaris_pass
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  gateway:
    image: gradle:8-jdk21
    container_name: p1-gateway-placeholder
    working_dir: /workspace
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/p1_gateway
      QUARKUS_DATASOURCE_USERNAME: p1_gateway
      QUARKUS_DATASOURCE_PASSWORD: p1_gateway
    volumes:
      - ../gateway-service:/workspace
    command: ["sh", "-c", "tail -f /dev/null"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /workspace/build.gradle.kts"]
      interval: 5s
      timeout: 5s
      retries: 5
